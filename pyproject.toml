[project]
name = "tape"
version = "0.1.0"
description = "Bar-level US equity backtesting service"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anywidget>=0.11.0",
    "exchange-calendars>=4.13",
    "fastapi>=0.120",
    "httpx2>=2.16",
    "marimo==0.25.2",
    "numba>=0.68",
    "numpy>=2.5",
    "pandas>=2.3",
    "plotly>=6.3",
    "pyarrow>=26",
    "pydantic>=2.14",
    "ta-lib>=0.8.3",
    "uvicorn>=0.38",
    "xlsxwriter>=3.3.1",
]

[project.scripts]
tape = "tape.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "openpyxl>=3.1.5",
    "pandas-stubs>=2.3",
    "pyarrow-stubs>=20",
    "pytest>=9.2",
    "ruff>=0.17",
    "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "PERF", "PL", "RUF", "TID", "TC"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"src/tape/service/api.py" = ["TC001", "TC002", "TC003"]
"src/tape/lab/pages/*.py" = ["B018", "PLR0913", "PLR0917", "PLR1711"]
"src/tape/lab/mount.py" = ["TC002"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "tape.engine.strategy.StrategyConfig"]

[tool.ruff.lint.isort]
known-first-party = ["tape"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["talib", "talib.*", "numba", "numba.*", "exchange_calendars", "exchange_calendars.*", "plotly", "plotly.*", "xlsxwriter", "xlsxwriter.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tape.lab.pages.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
filterwarnings = ["error"]
